[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usagi-lang-local"
version = "1.1.0"
description = "Usagi Language 1.1 standard compiler targeting C11"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
usagic = "usagi.cli:main"

[tool.setuptools]
packages = ["usagi"]

[tool.setuptools.package-data]
usagi = ["runtime.c"]
