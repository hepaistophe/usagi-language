[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usagi-lang-local"
version = "0.5.0"
description = "An experimental Usagi language compiler targeting C11"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
usagic = "usagi.cli:main"

[tool.setuptools]
packages = ["usagi"]

[tool.setuptools.package-data]
usagi = ["runtime.c"]
